name: Vérifier

# Ce que protège cette Action, à chaque PR et à chaque poussée sur main :
#
#   check_coquille  sw.js liste-t-il tout ce que la page charge ? (le filet
#                   `data/seed.json` était servi au réseau SEULEMENT)
#   check_graine    la même graine rejoue la même saison (un `Math.random`
#                   glissé dans js/sim.js la fait échouer)
#   check_ballottage la seule décision qui fait ENTRER un joueur neuf se
#                   rejoue aussi, et les journées d'avant ne bougent pas (S66)
#   check_gros      les gros matchs (S70) : une ligue sans joueur n'en a pas,
#                   les plans sont neutres pas contrés et payants contrés, et
#                   l'entracte ne touche pas aux deux premières périodes
#   check_commentaire le commentateur (S70) : aucun gabarit oublié, un match
#                   ne radote pas, la même graine redit la même chose
#   check_feuilles  les quatre égalités de la feuille de match, sur une ligue
#                   de 1312 matchs — la colonne vertébrale du moteur
#   check_table     les égalités de la feuille d'un match SUR TABLE (les buts
#                   des joueurs font ceux de l'équipe, les lancers font les
#                   arrêts plus les buts) — l'équivalent de check_feuilles
#                   pour le moteur du mode bonus
#   check_parts     la production se répartit-elle entre les joueurs comme la
#                   vraie saison l'a répartie ? (les lancers SIMULÉS par rang
#                   d'unité, toutes situations — c'est l'avantage numérique qui
#                   s'empilait sur le premier trio, et la version d'avant, qui
#                   ne lisait que les forces égales, ne pouvait pas le voir)
#
#   check_ratings   la corrélation force d'équipe / vrai classement, qui doit
#                   rester autour de 0,8 — c'est aussi le SEUL portier de
#                   `build-data.yml`, qui commite des shards sur main
#   check_traits    chaque nom de réputation existe dans les shards (un nom mal
#                   orthographié est un trait mort), la rareté, et le fait
#                   qu'un trait suive le joueur plutôt que sa case
#   check_fiches    la fiche reconstituée d'un club : un joueur échangé porte sa
#                   saison entière sous CHACUN de ses clubs, donc il sort du
#                   total — et deux gardiens comptent chacun leur match quand
#                   l'un relève l'autre, donc le calendrier n'est pas la somme
#                   de leurs présences
#   check_regles    les treize règles du plateau, vérifiées entre chaque geste :
#                   une pièce par case, la rondelle toujours jouable, le
#                   porteur jamais au sol, un match qui finit sur un gagnant —
#                   et les règles écrites comparées aux gestes réellement joués
#   smoke           le parcours complet à 390 px dans Chromium : vestiaire,
#                   loto, saison, séries, zéro erreur console
#   smoke_table     le même, en mode bonus : le tournoi, le plateau, un match
#                   joué geste par geste, le bilan
#
# Tous passent par `scripts/verdict.mjs`, qui pose le code de sortie : un
# chiffre qu'on imprime sans le juger est un chiffre que personne ne relit.
#
# Les scripts de calibration (monotonie, plafond, tireurs) sont trop longs
# pour tourner ici ; ils restent à lancer à la main, voir CLAUDE.md. Ils
# rendent maintenant un vrai code de sortie eux aussi.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: La coquille hors ligne est complète
        run: node scripts/check_coquille.mjs

      - name: Le moteur se rejoue sur sa graine
        run: node scripts/check_graine.mjs

      - name: Le ballottage se rejoue
        run: node scripts/check_ballottage.mjs

      - name: Les gros matchs mis en scène
        run: LIGUES=4 node scripts/check_gros.mjs

      - name: Le commentateur du direct
        run: node scripts/check_commentaire.mjs

      - name: Les égalités de la feuille de match
        run: LIGUES=1 node scripts/check_feuilles.mjs

      # DÉTERMINISTE : quatre ligues de vraies équipes, tirées et jouées sous
      # une graine fixe. Sans la graine, les repères par rang bougeraient de
      # ±3 points d'une exécution à l'autre et ce garde-fou crierait pour du
      # bruit. Sept secondes.
      - name: La production se répartit comme dans la vraie vie
        run: node scripts/check_parts.mjs

      # À 240 matchs, pas 60 : la cible de 5 à 6 buts a été mesurée sur 240,
      # et un échantillon de 60 a un écart type de 0,2 but — il lisait 4,93
      # pendant que les 240 lisaient 5,2. Les 240 matchs coûtent douze secondes.
      - name: Les égalités de la feuille sur table
        run: node scripts/check_table.mjs

      - name: Les règles du plateau tiennent
        run: MATCHS=80 node scripts/check_regles.mjs

      - name: Les cotes tiennent leur corrélation
        run: node scripts/check_ratings.mjs

      - name: Les traits restent rares et se voient
        run: node scripts/check_traits.mjs

      - name: La fiche reconstituée d'un club tient
        run: node scripts/check_fiches.mjs

      # Une icône = un sens, « énergie » hors de l'écran, et les chiffres de la page des règles
      # reconstruits depuis leurs constantes (1.0, jalon C). Une seconde.
      - name: La clarté
        run: node scripts/check_clarte.mjs

      # Zéro code inutile (1.0, jalon 3) : aucune déclaration morte, aucun
      # `export` ni import de trop, aucune classe CSS sans élément. Cinq secondes.
      - name: Le code mort
        run: node scripts/check_mort.mjs

      # Les vérifications rapides (moins de quinze secondes chacune) qui ne
      # tournaient nulle part : le deck, l'identité, l'atelier, le dépistage,
      # les totaux du soir. `scripts/tout.mjs` les enchaîne et sort en échec si
      # une seule échoue. Une demi-minute.
      - name: Les vérifications rapides
        run: node scripts/tout.mjs

      - name: Installer Playwright (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Test de fumée à 390 px
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/ >/dev/null && break; sleep 0.5; done
          node scripts/smoke.mjs http://localhost:8000

      - name: Test de fumée du mode bonus « Sur table »
        run: node scripts/smoke_table.mjs http://localhost:8000
